name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # One exact version of the quality gate; an update is a change of this file.
  QUALITY_GATE_VERSION: "0.2.0-next.0"

jobs:
  qodana:
    name: Tests and Qodana
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Check out the commit of the pull request
        uses: actions/checkout@v5
        with:
          # The head commit, not the merge commit; the full history for the pull-request mode.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run the tests with coverage
        run: >
          dotnet test Parcel.sln
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=lcov
          -p:CoverletOutput="$GITHUB_WORKSPACE/.qodana/code-coverage/"

      # coverlet writes the paths of the runner into the report. Qodana runs in a container with
      # the project at /data/project. SOURCE_ROOT replaces the workspace path of the runner in
      # each SF record: "/data/project/" gives the paths of the container, "" gives paths
      # relative to the project root, and "keep" changes nothing.
      - name: Set the paths of the coverage report
        env:
          SOURCE_ROOT: keep
        run: |
          report=.qodana/code-coverage/coverage.info
          if [ "$SOURCE_ROOT" != keep ]; then
            sed -i "s|^SF:$GITHUB_WORKSPACE/|SF:$SOURCE_ROOT|" "$report"
          fi
          ls -l .qodana/code-coverage
          grep -E '^(SF|LF|LH|BRF|BRH):' "$report"

      # The paid linter checks its licence with the project token. Only this step gets the token.
      # Qodana runs in a container with the project at /data/project, so `args` names the
      # coverage directory by its path there.
      - name: Run Qodana
        uses: JetBrains/qodana-action@v2026.3.1
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2104704481 }}
        with:
          args: --coverage-dir /data/project/.qodana/code-coverage
          # The paid .NET linter has a pull-request mode.
          pr-mode: true
          results-dir: ${{ runner.temp }}/qodana/results
          # The repository is public: the action uploads nothing. See the step that keeps the result files.
          upload-result: false
          artifact-name: qodana-results
          use-caches: false
          post-pr-comment: true

      # The quality gate reads the result file of the finished Qodana run. Every step from here on
      # has `if: ${{ !cancelled() }}`: the Qodana step fails when a threshold of qodana.yaml fails,
      # and the gate must still run and comment.
      - name: Set up Node for the gate
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          package-manager-cache: false

      # A clean directory outside the checkout. Only this step gets the packages token.
      - name: Install the gate
        if: ${{ !cancelled() }}
        env:
          GITHUB_PACKAGES_TOKEN: ${{ secrets.DOT_NET_SECRET }}
        run: |
          mkdir -p "$RUNNER_TEMP/quality/gate"
          cd "$RUNNER_TEMP/quality/gate"
          echo '{ "private": true }' > package.json
          printf '%s\n' '@paragondata:registry=https://npm.pkg.github.com' \
            '//npm.pkg.github.com/:_authToken=${GITHUB_PACKAGES_TOKEN}' > .npmrc
          npm install --no-audit --no-fund --ignore-scripts \
            "@paragondata/factory-quality-gate@$QUALITY_GATE_VERSION"

      - name: Show the gate version
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/quality/gate/node_modules/.bin/factory-quality-gate" --version

      # For the live checks only: what the Qodana step left. It prints a few fields of each result
      # file and no finding.
      - name: Show the Qodana results directory
        if: ${{ !cancelled() }}
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULTS: ${{ runner.temp }}/qodana/results
        run: |
          echo "event: $GITHUB_EVENT_NAME"
          echo "head commit: $HEAD_SHA"
          echo "GITHUB_SHA: $GITHUB_SHA"
          echo "checked out now: $(git rev-parse HEAD)"
          ls -la "$RESULTS" || true
          for file in qodana.sarif.json qodana-short.sarif.json start/qodana.sarif.json end/qodana.sarif.json; do
            node -e '
              const fs = require("node:fs");
              const [file, head] = process.argv.slice(1);
              if (!fs.existsSync(file)) {
                console.log(file + ": absent");
                process.exit(0);
              }
              const run = JSON.parse(fs.readFileSync(file, "utf8")).runs?.[0] ?? {};
              const invocation = run.invocations?.[0] ?? {};
              const revision = run.versionControlProvenance?.[0]?.revisionId ?? null;
              const facts = {
                bytes: fs.statSync(file).size,
                linter: (run.tool?.driver?.name ?? null) + " " + (run.tool?.driver?.version ?? null),
                revisionId: revision,
                revisionIsHead: revision === head,
                exitCode: invocation.exitCode ?? null,
                exitCodeDescription: invocation.exitCodeDescription ?? null,
                analysisKind: run.automationDetails?.properties?.analysisKind ?? null,
                baselineSource: run.properties?.baselineSource ?? null,
                coverageFilesProvided: run.properties?.["qodana.coverage.files.provided"] ?? null,
                coverage: run.properties?.coverage ?? null,
                failureConditions: run.properties?.qodanaFailureConditions ?? null,
                results: Array.isArray(run.results) ? run.results.length : null,
              };
              console.log(file + ": " + JSON.stringify(facts));
            ' "$RESULTS/$file" "$HEAD_SHA"
          done

      # The verdict. The paid linter writes the coverage of the new code in pull-request mode, so
      # the gate checks it against its default minimum. Only complexity is not checked. The step
      # ends with the exit code of the gate: 0 passed, 2 failed, 1 unavailable.
      - name: Run the gate
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULTS: ${{ runner.temp }}/qodana/results
        run: |
          out="$RUNNER_TEMP/quality/out/verdict"
          mkdir -p "$out"
          # A push to main has no pull request to comment on.
          scope=()
          if [ -n "$PR_NUMBER" ]; then scope=(--pr "$PR_NUMBER" --comment); fi
          gate=("$RUNNER_TEMP/quality/gate/node_modules/.bin/factory-quality-gate"
            --analyser qodana
            --qodana-results "$RESULTS"
            --without-complexity
            --commit "$HEAD_SHA"
            "${scope[@]}"
            --out "$out/quality.json"
            --comment-file "$out/comment.md")
          printf '%q ' "${gate[@]}" | tee "$out/command.txt"
          echo
          # The exit code of the gate, not of tee.
          set +e
          "${gate[@]}" 2>&1 | tee "$out/output.txt"
          code=${PIPESTATUS[0]}
          set -e
          echo "$code" > "$out/exit-code.txt"
          echo "gate exit code: $code"
          exit "$code"

      # For the trial checks only: Qodana's own result alone, the directory of the first stage, and
      # the coverage minimum at and just above the value of the file. They post no comment and
      # never fail the job.
      - name: Run the gate variants of the trial checks
        if: ${{ !cancelled() }}
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RESULTS: ${{ runner.temp }}/qodana/results
        run: |
          scope=()
          if [ -n "$PR_NUMBER" ]; then scope=(--pr "$PR_NUMBER"); fi
          variant() {
            local name="$1"
            shift
            local out="$RUNNER_TEMP/quality/out/$name"
            mkdir -p "$out"
            local gate=("$RUNNER_TEMP/quality/gate/node_modules/.bin/factory-quality-gate"
              --analyser qodana
              "$@"
              "${scope[@]}"
              --out "$out/quality.json"
              --comment-file "$out/comment.md"
              --summary "$out/summary.md")
            echo "::group::$name"
            printf '%q ' "${gate[@]}" | tee "$out/command.txt"
            echo
            # The exit code of the gate, not of tee.
            set +e
            "${gate[@]}" 2>&1 | tee "$out/output.txt"
            local code=${PIPESTATUS[0]}
            set -e
            echo "$code" > "$out/exit-code.txt"
            echo "gate exit code: $code"
            echo "::endgroup::"
          }
          variant both-opt-outs --qodana-results "$RESULTS" --without-coverage --without-complexity --commit "$HEAD_SHA"
          variant start-directory --qodana-results "$RESULTS/start" --without-complexity --commit "$HEAD_SHA"
          # The line coverage of the new code as the gate computes it: covered lines by lines,
          # rounded down to one decimal. Empty when the file has no usable counts.
          value="$(node -e '
            const fs = require("node:fs");
            let coverage;
            try {
              coverage = JSON.parse(fs.readFileSync(process.argv[1], "utf8")).runs?.[0]?.properties?.coverage;
            } catch {
              coverage = undefined;
            }
            const lines = coverage?.freshLines;
            const covered = coverage?.freshCoveredLines;
            const counts = [lines, covered].every((n) => typeof n === "number" && Number.isFinite(n) && n >= 0);
            if (counts && lines > 0 && covered <= lines) {
              console.log(Math.floor((covered * 1000) / lines) / 10);
            }
          ' "$RESULTS/qodana.sarif.json")"
          echo "line coverage of the new code, from the two counts of the file: ${value:-none}"
          if [ -n "$value" ]; then
            above="$(node -e 'console.log((Number(process.argv[1]) + 0.1).toFixed(1))' "$value")"
            variant minimum-at --qodana-results "$RESULTS" --without-complexity --commit "$HEAD_SHA" --coverage-minimum "$value"
            variant minimum-above --qodana-results "$RESULTS" --without-complexity --commit "$HEAD_SHA" --coverage-minimum "$above"
          fi

      # The repository is public: only the result files of Qodana are kept, never its log folder.
      # Nothing is kept when the text of the token is in one of the files.
      - name: Collect the Qodana result files
        if: ${{ !cancelled() }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_2104704481 }}
          RESULTS: ${{ runner.temp }}/qodana/results
        run: |
          keep="$RUNNER_TEMP/qodana/keep"
          mkdir -p "$keep"
          for file in qodana.sarif.json qodana-short.sarif.json start/qodana.sarif.json end/qodana.sarif.json log/changes.json report/results/coverageInformation.json; do
            if [ -f "$RESULTS/$file" ]; then
              mkdir -p "$keep/$(dirname "$file")"
              cp "$RESULTS/$file" "$keep/$file"
            fi
          done
          ls -lR "$keep"
          if [ -n "$QODANA_TOKEN" ] && grep -rlF -f <(printf '%s' "$QODANA_TOKEN") "$keep"; then
            echo "The text of the token is in the files named above. Nothing is kept."
            rm -rf "$keep"
            exit 1
          fi

      - name: Keep the Qodana result files
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: qodana-result-files
          path: ${{ runner.temp }}/qodana/keep
          if-no-files-found: warn

      - name: Keep the gate reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: ${{ runner.temp }}/quality/out
          if-no-files-found: warn

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          include-hidden-files: true
          path: .qodana/code-coverage/
